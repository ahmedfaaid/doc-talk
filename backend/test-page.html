<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal RAG API Tester</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .endpoint { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #005a87; }
        .result { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 3px; white-space: pre-wrap; }
        .success { border-left: 4px solid #4caf50; }
        .error { border-left: 4px solid #f44336; }
    </style>
</head>
<body>
    <h1>🏛️ Legal RAG API Tester</h1>
    
    <div class="endpoint">
        <h3>Health Check (GET)</h3>
        <button onclick="testHealthCheck()">Test Health Check</button>
        <div id="health-result" class="result"></div>
    </div>
    
    <div class="endpoint">
        <h3>Legal Types (GET)</h3>
        <button onclick="testLegalTypes()">Test Legal Types</button>
        <div id="types-result" class="result"></div>
    </div>
    
    <div class="endpoint">
        <h3>Legal Analysis (POST)</h3>
        <button onclick="testLegalAnalysis()">Test Legal Analysis</button>
        <div id="analysis-result" class="result"></div>
    </div>
    
    <div class="endpoint">
        <h3>Legal Reasoning (POST)</h3>
        <button onclick="testLegalReasoning()">Test Legal Reasoning</button>
        <div id="reasoning-result" class="result"></div>
    </div>
    
    <div class="endpoint">
        <h3>User Context (GET)</h3>
        <button onclick="testUserContext()">Test User Context</button>
        <div id="context-result" class="result"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:3001';
        
        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(url, options);
                const data = await response.json();
                return { success: response.ok, status: response.status, data };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        function displayResult(elementId, result) {
            const element = document.getElementById(elementId);
            if (result.success) {
                element.className = 'result success';
                element.textContent = `✅ Status: ${result.status}\n${JSON.stringify(result.data, null, 2)}`;
            } else {
                element.className = 'result error';
                element.textContent = `❌ Error: ${result.error || 'Request failed'}`;
            }
        }
        
        async function testHealthCheck() {
            const result = await makeRequest(`${BASE_URL}/health`);
            displayResult('health-result', result);
        }
        
        async function testLegalTypes() {
            const result = await makeRequest(`${BASE_URL}/api/legal/types`);
            displayResult('types-result', result);
        }
        
        async function testLegalAnalysis() {
            const result = await makeRequest(`${BASE_URL}/api/legal/analyze`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query: 'What are the liability implications of breach of contract under California law?',
                    userId: 'test-user-123'
                })
            });
            displayResult('analysis-result', result);
        }
        
        async function testLegalReasoning() {
            const result = await makeRequest(`${BASE_URL}/api/legal/reason`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query: 'What are the consequences of violating the confidentiality clause?',
                    documents: [{ id: 'doc1', content: 'Sample contract with confidentiality clause...' }],
                    context: { jurisdiction: 'California' }
                })
            });
            displayResult('reasoning-result', result);
        }
        
        async function testUserContext() {
            const result = await makeRequest(`${BASE_URL}/api/legal/context/test-user-123`);
            displayResult('context-result', result);
        }
    </script>
</body>
</html>
